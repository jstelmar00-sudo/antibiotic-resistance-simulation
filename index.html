<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Can you stop the resistance?</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#24382b;font:16px system-ui,sans-serif}main{max-width:760px;margin:auto;padding:22px;text-align:center}h1{color:#19540d;font-size:clamp(26px,5vw,38px);margin:0 0 8px}p{line-height:1.5;margin:8px 0 16px}.dish{background:#f2f8f5;border-radius:22px;padding:12px}svg{width:100%;max-height:340px;display:block}.legend{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;font-size:13px}.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px}h2{color:#19540d;font-size:23px;margin:20px 0 8px}.progress{display:flex;gap:7px;margin:18px 0}.progress span{height:6px;flex:1;background:#e1e6e1;border-radius:9px}.progress span.active{background:#559a42}button{background:#19540d;color:white;border:0;border-radius:9px;padding:14px 22px;font:600 16px system-ui;width:100%;cursor:pointer}button:hover{background:#337527}button:focus-visible{outline:3px solid #65c5e1;outline-offset:3px}small{display:block;color:#66756b;margin-top:12px}.microbe{animation:appear .35s ease both}@keyframes appear{from{opacity:0}to{opacity:1}}@media(prefers-reduced-motion:reduce){.microbe{animation:none}}
</style></head><body><main><h1>Can you stop the resistance?</h1><p>Discover what happens when a bacterial population is exposed to antibiotics.</p><div class="dish"><svg id="dish" viewBox="0 0 340 270" role="img" aria-label="Illustration of a bacterial population in a Petri dish"></svg><div class="legend"><span><i class="dot" style="background:#75cbe3"></i>Susceptible bacteria</span><span><i class="dot" style="background:#78af55"></i>Resistant bacteria</span></div></div><section aria-live="polite"><h2 id="heading"></h2><p id="description"></p></section><div class="progress" id="progress" aria-hidden="true"></div><button id="next"></button><small>Illustrative simulation — not experimental data.</small></main><script>
const stages=[['Stage 1: Initial population','A bacterial population contains susceptible and resistant bacteria.','Apply antibiotics'],['Stage 2: Antibiotic exposure','Antibiotics kill or weaken susceptible bacteria.','Observe survivors'],['Stage 3: Resistant survivors','Bacteria with resistance mechanisms survive.','Allow bacteria to reproduce'],['Stage 4: Resistant population','Resistant bacteria reproduce and pass on their resistance genes.','Restart simulation']];let stage=0;const $=id=>document.getElementById(id);function render(){let s='<circle cx="170" cy="132" r="125" fill="#e3f0e8" stroke="#abc8bc" stroke-width="2"/><circle cx="170" cy="132" r="116" fill="#f8fcfa" stroke="#d0e0d8" stroke-width="2"/>';for(let i=0;i<24;i++){if(stage===2&&i>=3)continue;let r=Math.sqrt((i+.5)/24)*94,x=170+r*Math.cos(i*2.4),y=132+r*Math.sin(i*2.4),res=i<3||stage===3,fill=res?'#78af55':'#75cbe3',stroke=res?'#4a8535':'#479fb9',dead=stage===1&&!res;s+=`<g transform="translate(${x} ${y}) rotate(${i*47})" opacity="${dead?.18:1}"><g class="microbe"><path d="M12 0 Q25 -15 28 0 T37 4 M-10 -7 l-3 -5 M-4 -7 l-3 -5 M2 -7 l-3 -5 M8 -7 l-3 -5 M-10 7 l-3 5 M-4 7 l-3 5 M2 7 l-3 5 M8 7 l-3 5" fill="none" stroke="${stroke}" stroke-width="1.6" stroke-linecap="round"/><rect x="-14" y="-7" width="28" height="14" rx="7" fill="${fill}" stroke="${stroke}"/><path d="M-8 0 Q-4 -5 0 0 T8 0" stroke="white" stroke-width="1.5" fill="none"/></g></g>`;if(dead)s+=`<path d="M${x-5} ${y-5} l10 10 m0 -10 l-10 10" stroke="#b85b55" stroke-width="1.5" opacity=".65"/>`;}if(stage===1)for(let i=0;i<5;i++)s+=`<g transform="translate(${86+i*41} ${83+(i%2)*100}) rotate(-40)"><rect x="-11" y="-5" width="22" height="10" rx="5" fill="#f4c67c" stroke="#cc9b48"/><path d="M0 -5 H6 A5 5 0 0 1 6 5 H0Z" fill="white"/></g>`;$('dish').innerHTML=s;$('heading').textContent=stages[stage][0];$('description').textContent=stages[stage][1];$('next').textContent=stages[stage][2];$('progress').innerHTML=stages.map((_,i)=>`<span class="${i<=stage?'active':''}"></span>`).join('');}$('next').addEventListener('click',()=>{stage=(stage+1)%4;render()});render();</script></body></html>
